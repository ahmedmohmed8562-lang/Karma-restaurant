<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم كارما - KARMA RESTAURANT</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0; }
        header { background: #1a1a1a; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo { font-size: 22px; font-weight: bold; color: #f3d08a; text-align: center; }
        .cart-icon { cursor: pointer; background: #2a2a2a; border: 1px solid #d4af37; padding: 8px 15px; border-radius: 20px; color: #f3d08a; font-weight: bold; }
        
        /* Search Bar */
        .search-box { padding: 15px 15px 0 15px; }
        .search-input { width: 100%; padding: 12px; background: #1c1c1c; border: 1px solid #d4af37; color: #fff; border-radius: 25px; box-sizing: border-box; text-align: center; font-size: 15px; outline: none; }

        /* Banner */
        .banner { background: linear-gradient(135deg, #2c2416, #1a1a1a); border: 1px solid #d4af37; margin: 15px; padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 15px; }
        .banner h4 { margin: 0 0 5px 0; color: #f3d08a; }
        .banner p { margin: 0; font-size: 13px; color: #bbb; }

        /* Official Menu Button */
        .official-menu-btn { background: linear-gradient(135deg, #d4af37, #aa820a); color: #121212; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; width: calc(100% - 30px); margin: 0 15px 15px 15px; cursor: pointer; text-align: center; display: block; box-shadow: 0 4px 15px rgba(212,175,55,0.3); }
        .official-menu-btn:hover { opacity: 0.9; }

        /* Categories Bar */
        .categories { display: flex; gap: 10px; overflow-x: auto; padding: 0 15px 10px 15px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: #1e1e1e; border: 1px solid #333; color: #fff; padding: 8px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 14px; }
        .cat-btn.active { background: #d4af37; color: #121212; font-weight: bold; border-color: #d4af37; }

        /* Products Grid */
        .container { padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .product-card { background: #1c1c1c; border: 1px solid #333; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .product-card img { width: 100%; height: 180px; object-fit: cover; }
        .product-info { padding: 15px; }
        .product-title { font-size: 18px; font-weight: bold; margin: 0 0 5px 0; color: #fff; }
        .product-desc { font-size: 13px; color: #aaa; margin: 0 0 10px 0; line-height: 1.4; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .price { color: #f3d08a; font-weight: bold; font-size: 16px; }
        
        .btn-add { background: #d4af37; color: #121212; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .btn-add:hover { background: #c59b27; }

        /* About Section */
        .about-section { margin: 20px 15px; background: #1c1c1c; border: 1px solid #333; border-radius: 12px; padding: 15px; }
        .about-section h3 { color: #f3d08a; text-align: center; margin-top: 0; }
        .about-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .about-card { background: #161616; border: 1px solid #444; border-radius: 10px; overflow: hidden; }
        .about-card img { width: 100%; height: 200px; object-fit: cover; }
        .about-card p { padding: 10px; margin: 0; font-size: 13px; color: #ccc; text-align: center; }

        /* Official Menu Modal */
        .menu-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; overflow-y: auto; padding: 10px; box-sizing: border-box; }
        .menu-content-box { background: #121212; border: 2px solid #d4af37; border-radius: 15px; padding: 15px; max-width: 900px; margin: auto; position: relative; color: #fff; box-shadow: 0 0 25px rgba(212,175,55,0.4); }
        
        .menu-header-center { text-align: center; border-bottom: 2px solid #d4af37; padding-bottom: 15px; margin-bottom: 20px; position: relative; }
        .menu-header-center h1 { color: #f3d08a; margin: 0; font-size: 26px; font-weight: bold; }
        .menu-header-center p { color: #d4af37; margin: 5px 0 0 0; font-size: 14px; }
        .close-menu-btn { position: absolute; top: 0; left: 0; background: #d4af37; color: #121212; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .menu-grid-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media(max-width: 768px) { .menu-grid-4 { grid-template-columns: 1fr; } }

        .menu-category-box { background: #1a1a1a; border: 1px solid #444; border-radius: 10px; padding: 12px; }
        .menu-cat-title { background: #d4af37; color: #121212; text-align: center; font-weight: bold; padding: 8px; border-radius: 6px; font-size: 16px; margin-bottom: 10px; }
        
        .menu-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #333; font-size: 13px; }
        .menu-item-name { color: #fff; display: flex; align-items: center; gap: 8px; }
        .menu-item-price { color: #f3d08a; font-weight: bold; white-space: nowrap; }
        .menu-item-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #d4af37; }

        .menu-footer-center { text-align: center; margin-top: 20px; border-top: 1px solid #444; padding-top: 10px; color: #f3d08a; font-weight: bold; font-size: 15px; }

        /* Cart Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e1e1e; border: 1px solid #d4af37; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; color: #fff; }
        .modal-content input { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

    <header>
        <div style="font-size: 14px; color: #d4af37;">🏠 مطعم كارما</div>
        <div class="logo">KARMA</div>
        <div class="cart-icon" onclick="toggleCart()">🛒 (<span id="cart-badge">0</span>)</div>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن وجبتك المفضلة..." oninput="searchProducts()">
    </div>

    <div class="banner">
        <div style="font-size: 28px;">🛵</div>
        <div>
            <h4>خدمة توصيل سريعة لجميع المناطق</h4>
            <p>استمتع بطعامك المفضل في منزلك بكل راحة</p>
        </div>
    </div>

    <button class="official-menu-btn" onclick="toggleOfficialMenu()">👑 عرض منيو مطعم كارما الرسمي</button>

    <div class="categories">
        <button class="cat-btn active" onclick="filterProducts('الكل', this)">الكل</button>
        <button class="cat-btn" onclick="filterProducts('مأكولات', this)">مأكولات</button>
        <button class="cat-btn" onclick="filterProducts('مشروبات', this)">مشروبات</button>
        <button class="cat-btn" onclick="filterProducts('مثلجات', this)">مثلجات</button>
        <button class="cat-btn" onclick="filterProducts('حلويات', this)">حلويات</button>
    </div>

    <div class="container" id="products-container"></div>

    <div class="about-section">
        <h3>✨ حول مطعم كارما</h3>
        <div class="about-grid" id="about-container">
            <p style="text-align:center; color:#777;">جاري التحميل...</p>
        </div>
    </div>

    <div class="menu-modal" id="officialMenuModal">
        <div class="menu-content-box">
            <button class="close-menu-btn" onclick="toggleOfficialMenu()">إغلاق X</button>
            
            <div class="menu-header-center">
                <h1>مطعم كارما</h1>
                <p>— مذاق لذيذ .. في كل وجبة —</p>
            </div>

            <div class="menu-grid-4">
                <div class="menu-category-box">
                    <div class="menu-cat-title">🍽️ المأكولات</div>
                    <div id="menu-makولات-list"></div>
                </div>
                <div class="menu-category-box">
                    <div class="menu-cat-title">🥤 المشروبات</div>
                    <div id="menu-mshrobat-list"></div>
                </div>
                <div class="menu-category-box">
                    <div class="menu-cat-title">🍦 المثلجات</div>
                    <div id="menu-mshelgat-list"></div>
                </div>
                <div class="menu-category-box">
                    <div class="menu-cat-title">🍰 الحلويات</div>
                    <div id="menu-hlwayat-list"></div>
                </div>
            </div>

            <div class="menu-footer-center">بالهناء والشفاء 🤍</div>
        </div>
    </div>

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <h3 style="color: #d4af37; margin-top:0;">سلة الطلبات</h3>
            <div id="cartList" style="margin-bottom: 10px; font-size: 14px; color: #ccc;">السلة فارغة</div>
            <p style="font-weight: bold;">المجموع: <span id="cartTotal" style="color: #f3d08a;">0</span> ج.س</p>
            
            <input type="text" id="customerName" placeholder="اسم العميل">
            <input type="tel" id="customerPhone" placeholder="رقم الهاتف">
            <input type="text" id="address" placeholder="العنوان">
            
            <button class="btn-add" style="width:100%; margin-top:10px; padding: 12px;" onclick="submitOrder()">تأكيد الطلب</button>
            <button class="cat-btn" style="width:100%; margin-top:8px; text-align:center;" onclick="toggleCart()">إغلاق</button>
        </div>
    </div>

    <script>
        let allProducts = [];
        let aboutItems = [];
        let cart = [];

        async function loadStoreData() {
            try {
                const resP = await fetch('/api/products');
                allProducts = await resP.json();
                displayProducts(allProducts);
                populateOfficialMenu(allProducts);

                const resA = await fetch('/api/about');
                aboutItems = await resA.json();
                displayAboutItems(aboutItems);
            } catch (e) { console.error(e); }
        }

        function displayProducts(products) {
            const grid = document.getElementById('products-container');
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:#777;">لا توجد منتجات مطابقة</p>';
                return;
            }
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image}" alt="${p.name}">
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            <p class="product-desc">${p.description || 'وجبة طازجة ولذيذة.'}</p>
                            <div class="product-footer">
                                <div class="price">${p.price} ج.س</div>
                                <button class="btn-add" onclick="addToCart('${p._id}')">إضافة +</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function displayAboutItems(items) {
            const container = document.getElementById('about-container');
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777;">لا توجد صور مضافة</p>';
                return;
            }
            items.forEach(item => {
                container.innerHTML += `
                    <div class="about-card">
                        <img src="${item.image}" alt="كارما">
                        <p>${item.description}</p>
                    </div>
                `;
            });
        }

        function populateOfficialMenu(products) {
            const makولاتList = document.getElementById('menu-makولات-list');
            const mshrobatList = document.getElementById('menu-mshrobat-list');
            const mshelgatList = document.getElementById('menu-mshelgat-list');
            const hlwayatList = document.getElementById('menu-hlwayat-list');

            makولاتList.innerHTML = '';
            mshrobatList.innerHTML = '';
            mshelgatList.innerHTML = '';
            hlwayatList.innerHTML = '';

            products.forEach(p => {
                let row = `
                    <div class="menu-item-row">
                        <div class="menu-item-name">
                            <img src="${p.image}" class="menu-item-img" alt="${p.name}">
                            <span>${p.name}</span>
                        </div>
                        <div class="menu-item-price">${p.price} ج.س</div>
                    </div>
                `;
                if (p.category === 'مأكولات') makولاتList.innerHTML += row;
                else if (p.category === 'مشروبات') mshrobatList.innerHTML += row;
                else if (p.category === 'مثلجات') mshelgatList.innerHTML += row;
                else if (p.category === 'حلويات') hlwayatList.innerHTML += row;
            });
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered);
        }

        function filterProducts(category, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'الكل') {
                displayProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                displayProducts(filtered);
            }
        }

        function toggleOfficialMenu() {
            const modal = document.getElementById('officialMenuModal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function addToCart(id) {
            const product = allProducts.find(p => p._id === id);
            if (product) {
                cart.push(product);
                updateCartUI();
                alert('تمت الإضافة للسلة بنجاح');
            }
        }

        function updateCartUI() {
            document.getElementById('cart-badge').innerText = cart.length;
            const listEl = document.getElementById('cartList');
            listEl.innerHTML = '';
            let total = 0;
            if (cart.length === 0) {
                listEl.innerHTML = 'السلة فارغة';
            } else {
                cart.forEach(item => {
                    total += Number(item.price);
                    listEl.innerHTML += `<div style="border-bottom:1px solid #333; padding:4px 0;">${item.name} - ${item.price} ج.س</div>`;
                });
            }
            document.getElementById('cartTotal').innerText = total;
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        async function submitOrder() {
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const address = document.getElementById('address').value;

            if (cart.length === 0) { alert('السلة فارغة!'); return; }
            if (!name || !phone || !address) { alert('الرجاء إدخال الاسم ورقم الهاتف والعنوان!'); return; }

            let total = cart.reduce((sum, item) => sum + Number(item.price), 0);

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customerName: name, customerPhone: phone, address, items: cart, totalPrice: total })
                });

                if (res.ok) {
                    alert('تم إرسال الطلب بنجاح!');
                    cart = [];
                    updateCartUI();
                    toggleCart();
                } else { alert('حدث خطأ أثناء إرسال الطلب'); }
            } catch (e) { console.error(e); }
        }

        loadStoreData();
    </script>
</body>
</html>
